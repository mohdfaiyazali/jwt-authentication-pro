{% extends 'base.html' %}
{% block title %}Register | JWT Auth Pro{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        <div class="auth-card p-4 p-md-5">
          <h2 class="fw-bold text-white">Create account</h2>
          <p class="text-white-50">Register, verify your email, then sign in.</p>
          <div id="authMessage" class="alert d-none" role="alert"></div>
          <form id="registerForm" class="row g-3">
            <div class="col-md-6"><input class="form-control form-control-lg" name="username" placeholder="Username" required></div>
            <div class="col-md-6"><input class="form-control form-control-lg" type="email" name="email" placeholder="Email" required></div>
            <div class="col-12"><input class="form-control form-control-lg" type="password" name="password" placeholder="Password" required></div>
            <div class="col-12">
              <select class="form-select form-select-lg" name="role">
                <option value="user" selected>User</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="col-12"><button class="btn btn-accent btn-lg w-100" type="submit">Register</button></div>
          </form>
          <p class="text-white-50 mt-3 mb-0">Already have an account? <a href="/login/">Login</a></p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
