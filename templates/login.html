{% extends 'base.html' %}
{% block title %}Login | JWT Auth Pro{% endblock %}
{% block content %}
<section class="auth-shell">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="auth-card p-4 p-md-5">
          <h2 class="fw-bold text-white">Welcome back</h2>
          <p class="text-white-50">Log in to continue managing your tasks.</p>
          <div id="authMessage" class="alert d-none" role="alert"></div>
          <form id="loginForm" class="vstack gap-3">
            <input class="form-control form-control-lg" name="username" placeholder="Username" required>
            <input class="form-control form-control-lg" type="password" name="password" placeholder="Password" required>
            <button class="btn btn-accent btn-lg" type="submit">Login</button>
          </form>
          <p class="text-white-50 mt-3 mb-0">New here? <a href="/register/">Create an account</a></p>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
