{% extends 'base.html' %}
{% block title %}Tasks | JWT Auth Pro{% endblock %}
{% block content %}
<section class="container py-5">
  <div class="d-flex flex-column flex-lg-row justify-content-between align-items-lg-end gap-3 mb-4">
    <div>
      <span class="badge text-bg-light text-dark rounded-pill px-3 py-2 mb-3">Task dashboard</span>
      <h1 class="display-6 fw-bold text-white mb-2">Manage your work in one place</h1>
      <p class="text-white-50 mb-0">Create tasks, search the list, and mark items complete without leaving the dashboard.</p>
    </div>
    <div class="d-flex gap-2">
      <button class="btn btn-outline-light" id="refreshTasksBtn" type="button">Refresh</button>
      <button class="btn btn-accent" id="logoutBtn" type="button">Logout</button>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-lg-4">
      <div class="panel-card p-4">
        <h5 class="text-white fw-semibold mb-3">New task</h5>
        <form id="taskForm" class="vstack gap-3">
          <input class="form-control form-control-lg" name="title" placeholder="Task title" required>
          <button class="btn btn-accent btn-lg" type="submit">Add Task</button>
        </form>
      </div>
      <div class="panel-card p-4 mt-4">
        <h5 class="text-white fw-semibold mb-3">Filters</h5>
        <input class="form-control mb-3" id="searchInput" placeholder="Search tasks">
        <div class="d-flex gap-2">
          <button class="btn btn-outline-light btn-sm" data-filter="all" type="button">All</button>
          <button class="btn btn-outline-light btn-sm" data-filter="open" type="button">Open</button>
          <button class="btn btn-outline-light btn-sm" data-filter="done" type="button">Done</button>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div id="taskMessage" class="alert d-none"></div>
      <div class="panel-card p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="text-white fw-semibold mb-0">Your tasks</h5>
          <span class="text-white-50 small" id="taskCount">0 items</span>
        </div>
        <div id="taskList" class="task-list"></div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
